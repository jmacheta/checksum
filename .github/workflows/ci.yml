name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.preset }}, ${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported versions (<print>: libstdc++ 14, libc++ 18). Clang uses the newest installed libstdc++,
          # so its libstdc++ jobs install g++-14.
          - { preset: native-gcc, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14" }
          - { preset: native-clang, cc: clang-18, cxx: clang++-18, packages: "clang-18 g++-14" }
          - { preset: native-clang-libcxx, cc: clang-18, cxx: clang++-18, packages: "clang-18 libc++-18-dev libc++abi-18-dev" }
          - { preset: native-asan, cc: clang-18, cxx: clang++-18, packages: "clang-18 g++-14" }
          # Library, tests and a consumer of every header built with -fno-exceptions -fno-rtti.
          - { preset: native-gcc-no-exceptions, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14" }
          # CRC acceleration: the x86_64 kernels (-mpclmul -msse4.2: PCLMULQDQ folding, SSE4.2 crc32) and the generic header (CHECKSUM_ACCELERATION=OFF).
          - { preset: x86_64-gcc-pclmul, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14" }
          - { preset: native-gcc-portable, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14" }
          # Arm and RISC-V targets, tests in QEMU user mode: the Arm kernels (PMULL, CRC32), the RISC-V Zbc kernel and the generic header.
          - { preset: cross-aarch64-pmull, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-aarch64-linux-gnu qemu-user", cross: aarch64-linux-gnu }
          - { preset: cross-aarch64-crc32, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-aarch64-linux-gnu qemu-user", cross: aarch64-linux-gnu }
          - { preset: cross-aarch64-portable, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-aarch64-linux-gnu qemu-user", cross: aarch64-linux-gnu }
          - { preset: cross-arm-portable, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-arm-linux-gnueabihf qemu-user", cross: arm-linux-gnueabihf }
          - { preset: cross-arm-crc32, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-arm-linux-gnueabihf qemu-user", cross: arm-linux-gnueabihf }
          - { preset: cross-riscv64-zbc, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-riscv64-linux-gnu qemu-user", cross: riscv64-linux-gnu }
          - { preset: cross-riscv64-portable, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 g++-14-riscv64-linux-gnu qemu-user", cross: riscv64-linux-gnu }
          # Big-endian AArch64: Ubuntu has no cross compiler for it, the Arm GNU Toolchain is downloaded.
          - { preset: cross-aarch64be, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14 qemu-user", arm_toolchain: aarch64_be-none-linux-gnu }
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ninja and compilers
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}

      # The presets name the compilers gcc/g++, clang/clang++, c++ (native-asan) and <triplet>-gcc/g++ (the cross presets of
      # cmake/emulator_presets.json); point those names at the versions under test, ahead of /usr/bin in PATH.
      - name: Select compiler versions
        run: |
          mkdir -p "$RUNNER_TEMP/compilers"
          for name in cc gcc clang; do ln -sf "$(command -v ${{ matrix.cc }})" "$RUNNER_TEMP/compilers/$name"; done
          for name in c++ g++ clang++; do ln -sf "$(command -v ${{ matrix.cxx }})" "$RUNNER_TEMP/compilers/$name"; done
          if [ -n "${{ matrix.cross }}" ]; then
            for name in gcc g++; do ln -sf "$(command -v ${{ matrix.cross }}-$name-14)" "$RUNNER_TEMP/compilers/${{ matrix.cross }}-$name"; done
          fi
          echo "$RUNNER_TEMP/compilers" >> "$GITHUB_PATH"

      - name: Install the Arm GNU Toolchain
        if: matrix.arm_toolchain
        run: |
          name=arm-gnu-toolchain-14.3.rel1-x86_64-${{ matrix.arm_toolchain }}
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/$name.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - name: Cache CPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('cmake/requirements.cmake') }}

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: clang-format check
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' \) | xargs clang-format-18 --dry-run --Werror

      - name: Install cmake-format
        run: pip install cmakelang

      - name: cmake-format check
        run: |
          find . \( -name 'CMakeLists.txt' -o -name '*.cmake' \) -not -path './cmake/CPM.cmake' -not -path './build/*' -not -path './.cpm-cache/*' \
            | xargs cmake-format --check

      - name: cspell
        run: npx --yes cspell@8 --config .cspell.yml --no-progress "**"
