name: Sync version tags

# Moves the major and minor tags (v1, v1.0) to the newest release, so `@v1` follows the latest compatible version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sync major/minor tags to"
        required: true
        type: string

concurrency:
  group: sync-version-tags
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync_version_tags:
    name: Sync version tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update major/minor version tags
        uses: cssnr/update-version-tags-action@dc7077eaec04b8fd61f7b7e6d4830564cfd12382 # v2.1.1
        with:
          tag: ${{ inputs.tag || github.event.release.tag_name }}
