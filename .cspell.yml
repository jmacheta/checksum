enabled: true
readonly: true
language: en
caseSensitive: false

useGitignore: false # ensures better compatibility when used in multiple projects

enabledFileTypes:
 - cpp
 - c
 - markdown
 - cmake
 - json
 - yaml

files: /**
ignorePaths:
 - .clangd
 - .clang-format
 - .cmake-format
 - .cspell.yml
 - build/**
 - install/**
 - .cpm-cache/**
 - cmake/CPM.cmake # vendored third-party file, not ours to spell-check
 - tests/unit_tests/include/crc_reference_vectors.hpp # reference vectors: hex digits

ignoreRegExpList:
 - /-W(no)*[a-z]+/g # ignore compiler warning flags
 - /-D[A-Z]+/g # ignore compiler define flags

